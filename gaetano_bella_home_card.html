<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Gaetano Sicignano — Bella Home</title>
<style>
  :root{
    --navy:#0a1628; --navy-2:#101f38; --navy-3:#16294a;
    --gold:#c9a84c; --gold-soft:#d9c078; --ivory:#f8f6f2;
    --muted:#8d97a8;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html{color-scheme:dark; background:var(--navy);}
  html,body{margin:0;padding:0;min-height:100%;background:var(--navy);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    color:var(--ivory); -webkit-text-size-adjust:100%;}
  body{
    background:
      radial-gradient(120% 60% at 50% -10%, rgba(201,168,76,0.10), transparent 60%),
      linear-gradient(180deg, var(--navy) 0%, var(--navy-2) 100%);
    min-height:100vh; min-height:100dvh;
    display:flex; justify-content:center;
    padding:0 0 48px 0;
  }
  .serif{font-family:Georgia,'Times New Roman',serif;}

  #card{
    width:100%; max-width:460px; position:relative;
    padding:0 0 8px 0;
  }

  /* ---------- hanging key ---------- */
  .key-wrap{
    position:absolute; top:0; right:34px; width:54px; height:220px;
    transform-origin:top center; pointer-events:none; z-index:5;
    animation:swing 6.5s ease-in-out infinite;
  }
  .key-wrap img{width:100%; display:block; filter:drop-shadow(0 6px 10px rgba(0,0,0,0.45));}
  @keyframes swing{
    0%,100%{ transform:rotate(-4.5deg); }
    50%{ transform:rotate(4.5deg); }
  }
  @media (prefers-reduced-motion:reduce){
    .key-wrap{ animation:none; transform:rotate(0deg); }
  }

  /* ---------- brand header ---------- */
  .brandhead{
    padding:40px 32px 0 32px; text-align:center;
  }
  .brandhead img{ width:158px; margin:0 auto; display:block; }

  /* ---------- top identity block ---------- */
  .identity{
    padding:30px 32px 0 32px; text-align:center;
  }
  .eyebrow{
    font-size:11px; letter-spacing:3px; text-transform:uppercase;
    color:var(--gold); opacity:0.85; margin-bottom:22px;
  }
  .portrait{
    width:176px; height:176px; margin:0 auto 26px auto;
    border-radius:50%; overflow:hidden; position:relative;
    padding:5px;
    background:linear-gradient(160deg, var(--gold-soft), var(--gold) 55%, #8a6d2b);
    box-shadow:0 20px 44px rgba(0,0,0,0.5), 0 0 0 1px rgba(201,168,76,0.15);
  }
  .portrait .inner{
    width:100%; height:100%; border-radius:50%; overflow:hidden;
    border:1px solid rgba(10,22,40,0.6);
  }
  .portrait img{width:100%; height:100%; object-fit:cover; object-position:50% 22%; display:block;}
  .name{
    font-size:29px; line-height:1.15; font-weight:400; letter-spacing:0.2px;
  }
  .role{
    margin-top:9px; font-size:13px; letter-spacing:0.8px; color:var(--gold-soft);
    font-weight:600;
  }
  .role .sep{color:var(--muted); font-weight:400; margin:0 6px;}

  .rule{
    position:relative; width:100%; height:1px; margin:38px 0 40px 0;
  }
  .rule::before{
    content:""; position:absolute; inset:0;
    background:linear-gradient(90deg, transparent 2%, var(--gold) 22%, var(--gold-soft) 50%, var(--gold) 78%, transparent 98%);
  }
  .rule::after{
    content:""; position:absolute; left:6%; right:6%; top:-7px; height:15px;
    background:linear-gradient(90deg, transparent, rgba(201,168,76,0.55) 35%, rgba(201,168,76,0.55) 65%, transparent);
    filter:blur(7px);
  }
  .rule .dot{
    position:absolute; left:50%; top:50%; width:5px; height:5px; border-radius:50%;
    background:var(--ivory); transform:translate(-50%,-50%);
    box-shadow:0 0 8px 2px rgba(248,246,242,0.8);
  }

  /* ---------- contact block ---------- */
  .contact{ padding:0 32px; }
  .cline{
    display:flex; align-items:center; gap:12px;
    padding:13px 0; border-bottom:1px solid rgba(248,246,242,0.08);
    text-decoration:none; color:var(--ivory);
  }
  .cline:last-child{border-bottom:none;}
  .cline .ico{
    width:18px; height:18px; flex-shrink:0; opacity:0.85;
  }
  .cline .txt{ display:flex; flex-direction:column; gap:2px; }
  .cline .label{ font-size:10px; letter-spacing:1.2px; text-transform:uppercase; color:var(--muted); }
  .cline .val{ font-size:15px; }

  /* ---------- actions ---------- */
  .actions{ padding:26px 32px 0 32px; display:flex; flex-direction:column; gap:12px; }
  .btn{
    display:flex; align-items:center; justify-content:center; gap:10px;
    padding:15px 18px; border-radius:3px; font-size:14px; font-weight:600;
    letter-spacing:0.3px; text-decoration:none; cursor:pointer; border:1px solid transparent;
  }
  .btn.primary{ background:var(--gold); color:#1a1204; }
  .btn.primary:active{ background:var(--gold-soft); }
  .btn.secondary{ background:transparent; color:var(--ivory); border-color:rgba(248,246,242,0.28); }
  .btn.secondary:active{ background:rgba(248,246,242,0.06); }
  .btn svg{ width:16px; height:16px; }

  /* ---------- footer / agency block ---------- */
  .footer{
    margin-top:44px; padding:26px 32px 0 32px; border-top:1px solid rgba(248,246,242,0.08);
    text-align:center;
  }
  .footer img{ width:150px; opacity:0.96; margin:0 auto 14px auto; display:block; }
  .footer .pres{ font-size:12.5px; color:var(--ivory); opacity:0.9; }
  .footer .pres b{ color:var(--gold-soft); font-weight:600; }
  .footer .loc{ margin-top:6px; font-size:11px; letter-spacing:0.6px; color:var(--muted); }

  .toast{
    position:fixed; left:50%; bottom:26px; transform:translate(-50%,14px);
    background:var(--navy-3); color:var(--ivory); border:1px solid rgba(201,168,76,0.4);
    padding:11px 18px; border-radius:4px; font-size:13px; opacity:0; pointer-events:none;
    transition:opacity .25s ease, transform .25s ease; z-index:50; white-space:nowrap;
  }
  .toast.show{ opacity:1; transform:translate(-50%,0); }
</style>
</head>

  document.getElementById('mailVal').textContent = CONFIG.email;
  document.getElementById('waLink').href = "https://wa.me/" + CONFIG.phoneRaw.replace('+','');

  function foldVCardLine(line){
    // RFC 2425 line folding: max 75 chars per line, continuation lines start with a single space
    const CRLF = "\r\n";
    if (line.length <= 75) return line;
    let out = line.slice(0, 75);
    let rest = line.slice(75);
    while (rest.length){
      out += CRLF + " " + rest.slice(0, 74);
      rest = rest.slice(74);
    }
    return out;
  }

  function saveContact(){
    const CRLF = "\r\n";
    const imgEl = document.querySelector('.portrait img');
    const dataUrl = imgEl ? imgEl.getAttribute('src') : '';
    const base64Photo = (dataUrl && dataUrl.includes(',')) ? dataUrl.split(',')[1] : '';

    const lines = [
      "BEGIN:VCARD",
      "VERSION:3.0",
      "N:" + CONFIG.fullName.split(' ').reverse().join(';'),
      "FN:" + CONFIG.fullName,
      "ORG:" + CONFIG.org,
      "TITLE:" + CONFIG.title,
      "TEL;TYPE=CELL:" + CONFIG.phoneRaw,
      "EMAIL:" + CONFIG.email,
      "ADR;TYPE=WORK:;;Calle Puig, 5;Castell\u00f3n de la Plana;;12004;Espa\u00f1a",
      "URL:" + CONFIG.website
    ];
    if (base64Photo){
      lines.push(foldVCardLine("PHOTO;ENCODING=b;TYPE=JPEG:" + base64Photo));
    }
    lines.push("END:VCARD");

    const vcard = lines.join(CRLF);
    const blob = new Blob([vcard], {type:"text/vcard"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = "Gaetano_Sicignano_BellaHome.vcf";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    const t = document.getElementById('toast');
    t.classList.add('show');
    setTimeout(()=>t.classList.remove('show'), 2200);
  }
</script>
